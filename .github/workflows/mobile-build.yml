name: Mobile Apps erstellen

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android APK erstellen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Release-Version übernehmen
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Release-Tags müssen das Format v1.2.3 verwenden."
            exit 1
          fi
          echo "APP_VERSION_NAME=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: APK erstellen
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew

          if [[ -n "${ANDROID_KEYSTORE_BASE64}${ANDROID_KEYSTORE_PASSWORD}${ANDROID_KEY_ALIAS}${ANDROID_KEY_PASSWORD}" ]] && \
             [[ -z "$ANDROID_KEYSTORE_BASE64" || \
                -z "$ANDROID_KEYSTORE_PASSWORD" || \
                -z "$ANDROID_KEY_ALIAS" || \
                -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Die Android-Signierung ist nur teilweise konfiguriert. Es werden alle vier Secrets benötigt."
            exit 1
          fi

          if [[ -n "$ANDROID_KEYSTORE_BASE64" && \
                -n "$ANDROID_KEYSTORE_PASSWORD" && \
                -n "$ANDROID_KEY_ALIAS" && \
                -n "$ANDROID_KEY_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/untiplan.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/untiplan.keystore"
            ./gradlew --no-daemon assembleRelease bundleRelease

            mkdir -p ../artifacts/android
            cp app/build/outputs/apk/release/app-release.apk ../artifacts/android/Untiplan.apk
            cp app/build/outputs/bundle/release/app-release.aab ../artifacts/android/Untiplan.aab
            printf 'release\n' > ../artifacts/android/build-type.txt
          else
            echo "Keine vollständige Android-Signierung konfiguriert; erstelle eine installierbare Test-APK."
            ./gradlew --no-daemon assembleDebug

            mkdir -p ../artifacts/android
            cp app/build/outputs/apk/debug/app-debug.apk ../artifacts/android/Untiplan-test.apk
            printf 'debug\n' > ../artifacts/android/build-type.txt
          fi

          cd ../artifacts/android
          sha256sum -- * > SHA256SUMS.txt

      - name: Android-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Untiplan-Android-${{ github.run_number }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS IPA erstellen
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: App-Icon vorbereiten
        working-directory: ios
        run: |
          sips \
            --resampleHeightWidth 1024 1024 \
            ../public/untiplan-logo.png \
            --out Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Xcode-Projekt erzeugen
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: iOS-App kompilieren
        working-directory: ios
        run: |
          set -euo pipefail
          app_version="1.0.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::Release-Tags müssen das Format v1.2.3 verwenden."
              exit 1
            fi
            app_version="${BASH_REMATCH[1]}"
          fi

          xcodebuild \
            -project Untiplan.xcodeproj \
            -scheme Untiplan \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            MARKETING_VERSION="$app_version" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: IPA verpacken
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p ../artifacts/ios/Payload
          ditto \
            build/Build/Products/Release-iphoneos/Untiplan.app \
            ../artifacts/ios/Payload/Untiplan.app
          cd ../artifacts/ios
          zip -qry Untiplan-unsigned.ipa Payload
          rm -rf Payload
          shasum -a 256 Untiplan-unsigned.ipa > SHA256SUMS.txt

      - name: iOS-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Untiplan-iOS-${{ github.run_number }}
          path: artifacts/ios/
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release veröffentlichen
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - android
      - ios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Android-Build herunterladen
        uses: actions/download-artifact@v5
        with:
          name: Untiplan-Android-${{ github.run_number }}
          path: downloads/android

      - name: iOS-Build herunterladen
        uses: actions/download-artifact@v5
        with:
          name: Untiplan-iOS-${{ github.run_number }}
          path: downloads/ios

      - name: Release-Dateien vorbereiten
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          find downloads/android -maxdepth 1 -type f \
            \( -name '*.apk' -o -name '*.aab' \) \
            -exec cp '{}' release/ \;
          find downloads/ios -maxdepth 1 -type f \
            -name '*.ipa' \
            -exec cp '{}' release/ \;

          test -n "$(find release -maxdepth 1 -type f -print -quit)"
          cd release
          sha256sum -- * > SHA256SUMS.txt

      - name: GitHub Release erstellen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            exit 0
          fi

          notes="Die iOS-Datei Untiplan-unsigned.ipa muss vor der Installation mit einem Apple-Konto signiert werden."
          release_flags=()

          if grep -qx 'debug' downloads/android/build-type.txt; then
            release_flags+=(--prerelease)
            notes+=$'\n\nDie Android-Datei ist ein Testbuild mit einem kurzlebigen Debug-Schlüssel und nicht für dauerhafte Updates oder Google Play vorgesehen.'
          fi

          gh release create "$tag" release/* \
            --verify-tag \
            --title "Untiplan $tag" \
            --generate-notes \
            --notes "$notes" \
            "${release_flags[@]}"
