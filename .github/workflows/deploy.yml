name: Untiplan prüfen und deployen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: untiplan-production
  cancel-in-progress: false

jobs:
  verify:
    name: Qualität prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository laden
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Lint ausführen
        run: npm run lint

      - name: Typen prüfen
        run: npm run typecheck

      - name: Tests ausführen
        run: npm test

      - name: Produktions-Build prüfen
        run: npm run build

  deploy:
    name: Auf Produktionsserver deployen
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production

    steps:
      - name: cloudflared installieren
        env:
          # 2026.5.1 ist gepinnt, weil neuere Versionen derzeit eine offene
          # Regression bei headless Service-Tokens für access ssh haben.
          CLOUDFLARED_VERSION: 2026.5.1
          CLOUDFLARED_SHA256: 3c6a5ba995a258dbe90f98e5fdb2c2620b7be72c3ca761614f6eb52aee252cea
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/cloudflared" \
            "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64"
          printf '%s  %s\n' "$CLOUDFLARED_SHA256" "$RUNNER_TEMP/cloudflared" | sha256sum --check -
          chmod 700 "$RUNNER_TEMP/cloudflared"

      - name: SSH-Verbindung vorbereiten
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Getesteten Commit deployen
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          DEPLOY_SHA: ${{ github.sha }}
          CLOUDFLARED_BIN: ${{ runner.temp }}/cloudflared
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          : "${TUNNEL_SERVICE_TOKEN_ID:?CF_ACCESS_CLIENT_ID fehlt}"
          : "${TUNNEL_SERVICE_TOKEN_SECRET:?CF_ACCESS_CLIENT_SECRET fehlt}"
          cloudflared_debug_log="$RUNNER_TEMP/cloudflared-debug.log"

          set +e
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "ProxyCommand=$CLOUDFLARED_BIN access ssh --hostname %h --log-level debug --logfile $cloudflared_debug_log" \
            -p "$SERVER_PORT" \
            "$SERVER_USER@$SERVER_HOST" \
            "DEPLOY_SHA='$DEPLOY_SHA' bash -se" <<'REMOTE'
          set -Eeuo pipefail

          cd /opt/untiplan

          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "Abbruch: Im Server-Repository liegen nicht eingecheckte Änderungen."
            exit 1
          fi

          previous_sha="$(git rev-parse HEAD)"
          git fetch --prune origin main
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          git checkout --detach "$DEPLOY_SHA"
          docker compose config --quiet

          if docker compose build --pull app && \
             docker compose up --detach --wait --wait-timeout 180 app; then
            echo "Untiplan wurde erfolgreich auf $DEPLOY_SHA aktualisiert."
            docker compose ps
            exit 0
          fi

          echo "Deployment fehlgeschlagen. Die letzten App-Logs folgen:"
          docker compose logs --tail=200 app || true
          echo "Vorheriger Stand $previous_sha wird wiederhergestellt."

          git checkout --detach "$previous_sha"
          docker compose build app
          docker compose up --detach --wait --wait-timeout 180 app

          echo "Rollback erfolgreich. Das Deployment bleibt als fehlgeschlagen markiert."
          exit 1
          REMOTE
          ssh_status=$?
          set -e

          if [ "$ssh_status" -ne 0 ] && [ -f "$cloudflared_debug_log" ]; then
            handshake_status="$(
              grep --text --only-matching --extended-regexp \
                'HTTP/[0-9.]+ [0-9]{3} [A-Za-z ]+' \
                "$cloudflared_debug_log" | tail --lines=1 || true
            )"

            if [ -n "$handshake_status" ]; then
              echo "::error::Cloudflare WebSocket-Handshake: $handshake_status"
            else
              echo "::error::Cloudflare hat keinen auswertbaren WebSocket-Status geliefert."
            fi
          fi

          exit "$ssh_status"
