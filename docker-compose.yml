name: untiplan

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET muss gesetzt sein}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      DATA_DIR: /app/data
      WEBUNTIS_CLIENT: ${WEBUNTIS_CLIENT:-Untiplan}
    volumes:
      - untiplan_data:/app/data
    ports:
      - "127.0.0.1:${APP_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_healthy
volumes:
  untiplan_data:
    name: untiplan_data
